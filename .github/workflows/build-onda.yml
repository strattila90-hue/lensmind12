name: Build Onda APK
on:
  push:
    branches: [main, 'ccr-*']
    paths: ['android-remote/**', '.github/workflows/build-onda.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        working-directory: android-remote
        run: >
          gradle assembleDebug --no-daemon
          -PbuildNumber=${{ github.run_number }}
          -PrepoSlug=${{ github.repository }}
      - name: Name the APK
        run: cp android-remote/app/build/outputs/apk/debug/app-debug.apk onda-haptic.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Onda-APK
          path: onda-haptic.apk
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: onda-${{ github.run_number }}
          name: Onda Haptic ${{ github.run_number }}
          make_latest: false
          target_commitish: ${{ github.sha }}
          files: onda-haptic.apk
